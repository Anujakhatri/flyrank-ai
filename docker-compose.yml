services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PASSWORD:-password}
      POSTGRES_DB: ${DATABASE:-tasks_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - HOST=db
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - app

volumes:
  pgdata:
