name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'first-crud-api/src/**'
      - 'first-crud-api/app.js'
      - 'first-crud-api/package.json'
      - 'first-crud-api/package-lock.json'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: first-crud-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: first-crud-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint .